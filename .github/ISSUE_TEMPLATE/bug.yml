name: Bug report
description: Report a reproducible problem in ASEF or its validation tools.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or sensitive project data. Use private vulnerability reporting for security issues."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ASEF version or commit
      placeholder: "v1.7.0"
