name: release

on:
  push:
    # Both spellings exist in this repository's history (`v1.7.0`, `1.8`), so
    # both publish. The script rejects a tag that is not a version number.
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (default: the version ASEF.md declares)"
        required: false
        type: string
      title:
        description: "Release title (default: ASEF <version>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A release must not diverge from the documents that declare it, so the
      # invariants gate publication exactly as they gate a push.
      - name: Check framework invariants
        run: python tools/asef_lint.py --verbose

      - name: Check the release rules
        run: python tools/release_notes.py --self-test

      # Inputs reach the script as environment variables, never interpolated
      # into the shell.
      - name: Derive tag, title and notes
        id: release
        env:
          REQUESTED: ${{ inputs.version }}
          TITLE: ${{ inputs.title }}
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python tools/release_notes.py \
            --requested "$REQUESTED" \
            --ref "$REF_NAME" \
            --title "$TITLE" \
            --out notes.md \
            --github-output

      # A release may already exist under the other spelling of the same
      # version, so find it before inventing a tag: publishing under the
      # preferred form regardless would duplicate it. A pushed tag is the only
      # candidate, so this resolves to that tag.
      - name: Pick the tag to publish under
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PREFERRED: ${{ steps.release.outputs.tag }}
          CANDIDATES: ${{ steps.release.outputs.tags }}
        run: |
          chosen=""
          for candidate in $CANDIDATES; do
            if gh release view "$candidate" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $candidate exists; publishing under it."
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            for candidate in $CANDIDATES; do
              # The checkout is shallow and carries no tags, so ask the API.
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$candidate" > /dev/null 2>&1; then
                echo "Tag $candidate exists without a release; publishing under it."
                chosen="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chosen" ]; then
            chosen="$PREFERRED"
            echo "No existing tag or release; publishing under $chosen."
          fi
          echo "tag=$chosen" >> "$GITHUB_OUTPUT"

      # Two ready-to-use archives, built by the same scripts users run, so they
      # carry exactly the runtime set: the skill with the framework bundled
      # (unzip into any agent's skills folder), and the framework alone
      # (unzip into a project as `asef/`).
      - name: Build the release archives
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          python skills/asef/scripts/install.py --dest dist/skill --bundle-framework
          python skills/asef/scripts/asef_prompt.py --project dist/project init
          (cd dist/skill && python -m zipfile -c "../asef-skill-$TAG.zip" asef)
          (cd dist/project && python -m zipfile -c "../asef-framework-$TAG.zip" asef)
          ls -l dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists; updating its title and notes."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          fi
          gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber

      # The release is already published once the step above succeeds, so this
      # one has to verify it rather than describe it: `gh release view --json`
      # exits non-zero on a field name it does not know, which once turned a
      # release that had fully succeeded into a red run. Checking the archives
      # are really attached is worth a step; printing the record was not.
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets > published.json
          python - <<'PY'
          import json, os, pathlib, sys

          tag = os.environ["TAG"]
          release = json.loads(pathlib.Path("published.json").read_text(encoding="utf-8"))
          attached = {asset["name"] for asset in release.get("assets", [])}
          expected = {path.name for path in pathlib.Path("dist").glob("*.zip")}

          problems = [f"archive {name} is missing from the release" for name in sorted(expected - attached)]
          if not expected:
              problems.append("no archive was built, so none could be attached")
          if release.get("isDraft"):
              problems.append("the release is still a draft")

          print(f"{tag}: {release.get('name')!r}, {len(attached)} asset(s): {', '.join(sorted(attached))}")
          for problem in problems:
              print(f"::error::{tag}: {problem}")
          sys.exit(1 if problems else 0)
          PY
