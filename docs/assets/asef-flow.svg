<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Flusso operativo di ASEF</title>
  <desc id="desc">Dalla richiesta al routing, al modulo attivo, agli artefatti, alla review, alla QA e al rilascio autorizzato.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08162f"/><stop offset="1" stop-color="#102752"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fb4ff"/></marker>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="62" fill="#f7f1e8" font-family="Arial, sans-serif" font-size="28" font-weight="700">Un percorso adattivo, non una pipeline obbligatoria</text>
  <text x="64" y="94" fill="#b9c9e8" font-family="Arial, sans-serif" font-size="17">Il router salta le fasi inutili e carica solo il contesto necessario.</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(55 150)"><rect width="165" height="118" rx="18" fill="#fffaf1"/><text x="82" y="44" text-anchor="middle" fill="#102752" font-size="17" font-weight="700">RICHIESTA</text><text x="82" y="75" text-anchor="middle" fill="#56647d" font-size="14">nuovo o esistente</text><text x="82" y="96" text-anchor="middle" fill="#56647d" font-size="14">app, SaaS o sito</text></g>
    <g transform="translate(290 150)"><rect width="165" height="118" rx="18" fill="#eaf1ff"/><text x="82" y="44" text-anchor="middle" fill="#17499b" font-size="17" font-weight="700">ROUTER</text><text x="82" y="75" text-anchor="middle" fill="#56647d" font-size="14">sceglie la route</text><text x="82" y="96" text-anchor="middle" fill="#56647d" font-size="14">e il punto d’ingresso</text></g>
    <g transform="translate(525 130)"><rect width="190" height="158" rx="18" fill="#fffaf1"/><text x="95" y="40" text-anchor="middle" fill="#102752" font-size="17" font-weight="700">MODULO ATTIVO</text><text x="95" y="69" text-anchor="middle" fill="#56647d" font-size="14">una sola fase</text><rect x="25" y="88" width="140" height="42" rx="10" fill="#ffe2d8"/><text x="95" y="114" text-anchor="middle" fill="#9b351c" font-size="13" font-weight="700">GUIDA SE SERVE</text></g>
    <g transform="translate(785 150)"><rect width="165" height="118" rx="18" fill="#eaf1ff"/><text x="82" y="44" text-anchor="middle" fill="#17499b" font-size="17" font-weight="700">ARTEFATTI</text><text x="82" y="75" text-anchor="middle" fill="#56647d" font-size="14">SPEC · PLAN · TASK</text><text x="82" y="96" text-anchor="middle" fill="#56647d" font-size="14">STATE aggiornato</text></g>
    <g transform="translate(1020 150)"><rect width="165" height="118" rx="18" fill="#fffaf1"/><text x="82" y="44" text-anchor="middle" fill="#102752" font-size="17" font-weight="700">REVIEW + QA</text><text x="82" y="75" text-anchor="middle" fill="#56647d" font-size="14">specifica · qualità</text><text x="82" y="96" text-anchor="middle" fill="#56647d" font-size="14">rischio · risultato</text></g>
    <g transform="translate(1250 150)"><rect width="105" height="118" rx="18" fill="#ffe2d8"/><text x="52" y="42" text-anchor="middle" fill="#9b351c" font-size="16" font-weight="700">SHIP?</text><text x="52" y="72" text-anchor="middle" fill="#6d493f" font-size="13">solo se</text><text x="52" y="94" text-anchor="middle" fill="#6d493f" font-size="13">autorizzato</text></g>
  </g>
  <g stroke="#8fb4ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M225 209H280"/><path d="M460 209H515"/><path d="M720 209H775"/><path d="M955 209H1010"/><path d="M1190 209H1240"/></g>
  <path d="M1102 282C1102 345 620 355 620 302" fill="none" stroke="#ff8a6a" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="860" y="378" text-anchor="middle" fill="#ffb19b" font-family="Arial, sans-serif" font-size="15">se un gate fallisce, torna solo alla fase necessaria</text>
</svg>
